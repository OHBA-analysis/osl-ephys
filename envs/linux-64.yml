# osl-ephys on Linux x86-64. As the conda packages of osl-dynamics do, this
# takes the software-rendering (OSMesa) build of VTK, so the 3D coregistration
# plots render on servers and clusters without a display; this is the only
# platform conda-forge builds it for
name: osle
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - fslpy
  - h5io
  - ipyevents
  - ipywidgets
  - matplotlib-base
  - mne-base
  - mne-icalabel
  - onnxruntime
  - nibabel
  - nilearn
  - numba
  - numpy
  - packaging
  - pandas
  - parse
  - pillow
  - pooch
  - pyside6
  - pyvista
  - pyvistaqt
  - pyyaml
  - scikit-image
  - scikit-learn
  - scipy
  - trame
  - trame-vtk
  - trame-vuetify
  - vtk=*=*osmesa*
  # glmtools, sails and osl-pathfinder are not on conda-forge, so they come
  # from PyPI with osl-ephys itself
  - pip:
      - osl-ephys
