name: Tests

on:
  push:
    branches: [main, v3]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags are needed by setuptools_scm
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      # The test recordings and parcellations from osl-files, fetched once
      - name: Cache the osl-files data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/osl-files
            ~/Library/Caches/osl-files
          key: osl-files-${{ runner.os }}-${{ hashFiles('osl_ephys/files/_fetch.py') }}

      - name: Run the tests
        env:
          MPLBACKEND: Agg
        run: pytest osl_ephys/tests
